<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="章权瑞的双语个人简历，聚焦 AI、具身智能与嵌入式系统。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>章权瑞 | Resume</title>
  <link rel="stylesheet" href="styles_v2.css?v=5">
  <script defer src="resume-data.js?v=4"></script>
  <script defer src="app.js?v=6"></script>
  <script defer src="editor.js?v=4"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <div class="page-tools" aria-label="页面工具">
    <div class="language-control" role="group" aria-label="语言">
      <button type="button" data-set-lang="zh" aria-pressed="true">中</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="icon-button" type="button" id="theme-toggle" aria-label="切换明暗主题" title="切换明暗主题">
      <span aria-hidden="true" id="theme-icon">◐</span>
    </button>
  </div>

  <main id="main-content"></main>

  <noscript>
    <div class="noscript-message">
      <h1>章权瑞</h1>
      <p>本页面需要 JavaScript 才能显示完整的双语简历。</p>
      <p><a href="mailto:zzzqr007@gmail.com">zzzqr007@gmail.com</a></p>
    </div>
  </noscript>

  <div class="editor-backdrop" id="editor-backdrop" hidden></div>
  <aside class="editor-panel" id="editor-panel" aria-labelledby="editor-title" aria-hidden="true">
    <header class="editor-header">
      <div>
        <p class="editor-kicker">仅保存在当前浏览器</p>
        <h2 id="editor-title">双语简历编辑器</h2>
      </div>
      <button type="button" class="icon-button editor-close" id="editor-close" aria-label="关闭编辑器">×</button>
    </header>

    <div class="editor-toolbar" aria-label="编辑器操作">
      <button type="button" class="button button-primary" id="editor-save">保存草稿</button>
      <button type="button" class="button" id="editor-undo">撤销本次修改</button>
      <button type="button" class="button" id="editor-import">导入 JSON</button>
      <button type="button" class="button" id="editor-export-json">导出 JSON</button>
      <button type="button" class="button" id="editor-export-js">导出数据文件</button>
      <button type="button" class="button button-danger" id="editor-reset">恢复默认</button>
      <input type="file" id="editor-import-file" accept="application/json,.json" hidden>
    </div>

    <p class="editor-status" id="editor-status" role="status" aria-live="polite">
      修改会即时预览，点击“保存草稿”后才会写入本地存储，不会自动同步 GitHub。
    </p>

    <nav class="editor-tabs" id="editor-tabs" aria-label="编辑内容分类"></nav>
    <form class="editor-form" id="editor-form"></form>
  </aside>
</body>
</html>
